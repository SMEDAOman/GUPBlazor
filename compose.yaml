name: riyada-design-system

services:
  gallery:
    build:
      context: .
      dockerfile: Dockerfile
    image: smeitoman/riyada-design-system:latest
    container_name: riyada-design-system
    ports:
      - "${DEMO_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__KeyRingPath: /keys
    volumes:
      - dp-keys:/keys
    restart: unless-stopped

volumes:
  dp-keys:
